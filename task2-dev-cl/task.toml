schema_version = "1.1"
artifacts = [
  { source = "/workspace/submission", destination = "submission", exclude = [
    "*/.terraform", "*/.terraform/**", "*/terraform.tfstate", "*/terraform.tfstate.*", "*/.terraform.tfstate.lock.info",
    "*/manifest.json",
    "*/terraform-provider-*", "*/.terraform-plugin-cache", "*/.terraform-plugin-cache/**", "*/.terraform-plugins",
    "*/.terraform-plugins/**", "*/.plugin-cache", "*/.plugin-cache/**", "*/plugin-cache", "*/plugin-cache/**",
  ] },
  { source = "/workspace/evidence", destination = "evidence" },
]

[task]
name = "devcloud/pulseroute"
description = "Deploy selective message routing, isolated consumer ledgers, partial batch recovery and KMS-encrypted messaging with exact least privilege as self-healing automation: independent nested-prefix deployments, removal of out-of-band access, key rescue, adoption after local state loss, and ownership-safe cleanup of protected ledgers."
keywords = ["cloud-infrastructure", "terraform", "opentofu", "sns", "sqs", "lambda", "dynamodb", "kms", "iam", "drift", "disaster-recovery"]
authors = [{ name = "Shulin Agarwal", email = "shga400@expert.micro1.ai" }]

